<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Калькулятор сметы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--g:#12805c;--g2:#0e6b4d;--ink:#1c222a;--gy:#646a74;--bd:#e3ddd0;--bg:#f6f3ec;--card:#fff;--y:#fff2cc;--lg:#d2f0e4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px}
body{padding-bottom:110px}
.top{padding:18px 16px 10px}
.kick{font-size:12px;letter-spacing:.22em;font-weight:800;color:var(--g)}
h1{margin:6px 0 4px;font-size:26px;line-height:1.1;font-weight:900}
.lead{color:var(--gy);font-size:14.5px;line-height:1.4;margin:0}
.seg{display:flex;gap:6px;background:#ebe6da;border-radius:14px;padding:4px;margin:12px 16px 0}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 4px;font-size:14px;font-weight:700;color:var(--gy);font-family:inherit}
.seg button.on{background:var(--card);color:var(--g);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mode{display:flex;align-items:center;gap:8px;margin:12px 16px 0;font-size:13.5px;color:var(--gy)}
.mode .seg{margin:0;flex:1}
.search{margin:12px 16px 0}
.search input{width:100%;border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;font-size:16px;background:var(--card);outline:none;font-family:inherit}
.search input:focus{border-color:var(--g)}
.sec{margin:18px 16px 8px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gy)}
.item{display:flex;align-items:center;gap:10px;margin:0 16px 8px;background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:12px}
.item.on{border-color:var(--g);background:#f3fbf7}
.item .nm{flex:1;min-width:0;font-size:14.5px;line-height:1.3;font-weight:600}
.item .pr{font-size:12.5px;color:var(--gy);margin-top:3px;font-weight:500}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:12px;border:0;background:var(--g);color:#fff;font-size:22px;font-weight:700;line-height:1;font-family:inherit}
.step button.m{background:#e9e4d8;color:var(--ink)}
.step input{width:44px;height:36px;text-align:center;border:1.5px solid var(--bd);border-radius:10px;font-size:16px;font-weight:700;background:var(--y);color:#0000ff;font-family:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(246,243,236,.96);backdrop-filter:blur(8px);border-top:1px solid var(--bd);display:flex;gap:12px;align-items:center;z-index:5}
.bar .sum{flex:1;line-height:1.2}
.bar .sum b{font-size:20px;display:block}
.bar .sum span{font-size:12.5px;color:var(--gy)}
.btn{border:0;border-radius:16px;background:var(--g);color:#fff;font-weight:800;font-size:16px;padding:15px 20px;font-family:inherit}
.btn.ghost{background:var(--card);color:var(--g);border:1.5px solid var(--g)}
.btn.full{width:100%;display:block;margin-top:10px;text-align:center}
.small{display:inline-block;font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--ink);margin:0 6px 0 0;font-family:inherit}
.small.on{background:var(--g);border-color:var(--g);color:#fff}
/* doc view */
.view{display:none}
.view.on{display:block}
.doc{margin:12px 16px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;overflow:hidden}
.doc h2{margin:2px 0 2px;font-size:17px;text-align:center}
.doc .sub{font-size:11.5px;color:var(--gy);text-align:center;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{background:#2f5597;color:#fff;padding:5px 3px;font-weight:700;border:1px solid #1f3d73}
td{padding:4px 3px;border:1px solid #cfcfcf;vertical-align:middle}
td.n,td.u,td.q{text-align:center}
td.p,td.s{text-align:right;white-space:nowrap}
tr.tot td{border:0;font-weight:800;padding-top:5px}
tr.line td{border:0;padding:3px}
tr.mat td{background:#d9d9d9;font-weight:700}
.ctl{margin:12px 16px 0}
.ctl .lab{font-size:13px;color:var(--gy);font-weight:700;margin:12px 0 6px}
.final{margin:12px 16px;background:var(--g);color:#fff;border-radius:18px;padding:14px 16px}
.final .a{font-size:13px;color:var(--lg)}
.final .b{font-size:30px;font-weight:900}
.cta{margin:16px;background:var(--card);border:1.5px solid var(--g);border-radius:20px;padding:16px}
.cta h3{margin:0 0 6px;font-size:18px}
.cta p{margin:0 0 4px;font-size:14px;color:var(--gy);line-height:1.4}
.empty{margin:30px 16px;text-align:center;color:var(--gy);font-size:15px;line-height:1.5}
.hint{margin:10px 16px 0;padding:10px 12px;border-radius:12px;background:var(--lg);color:#0b5a40;font-size:13px;line-height:1.35}
</style>
</head>
<body>
<div class="top">
  <div class="kick">ВСЁ ДЛЯ МАСТЕРА</div>
  <h1>Смета за 2 минуты</h1>
  <p class="lead">Так работает моя таблица «Мастер на час». Выберите позиции, впишите количество и смотрите готовую смету, допсоглашение и акт.</p>
</div>

<div class="seg" id="tabs">
  <button data-t="calc" class="on">Позиции</button>
  <button data-t="smeta">Смета</button>
  <button data-t="dop">Допсоглашение</button>
  <button data-t="akt">Акт</button>
</div>

<!-- PICKER -->
<div class="view on" id="v-calc">
  <div class="mode"><span>Количество для:</span>
    <div class="seg"><button data-m="1" class="on">Основного договора</button><button data-m="2">Допсоглашения</button></div>
  </div>
  <div class="seg" id="cats" style="margin-top:10px"><button data-c="work1" class="on">Ремонт и навеска</button><button data-c="work2">Сборка и установка</button><button data-c="mat">Материалы</button></div>
  <div class="search"><input id="q" type="search" placeholder="Поиск по позициям"></div>
  <div class="hint" id="hint"></div>
  <div id="list"></div>
  <div style="margin:18px 16px 0;display:flex;gap:10px">
    <button class="btn ghost" style="flex:1" id="demo">Заполнить пример</button>
    <button class="btn ghost" style="flex:1" id="reset">Сбросить</button>
  </div>
</div>

<!-- DOC VIEWS -->
<div class="view" id="v-smeta"></div>
<div class="view" id="v-dop"></div>
<div class="view" id="v-akt"></div>

<div class="bar" id="bar">
  <div class="sum"><b id="bsum">0 ₽</b><span id="bcnt">позиций: 0</span></div>
  <button class="btn" id="bgo">Смотреть смету</button>
</div>

<script>
// ====== НАСТРОЙКИ ======
var BUY_URL = "https://t.me/Kozlov_Ander";          // ссылка на оплату в Prodamus (вставьте свою)
var CONTACT_URL = "https://t.me/Kozlov_Ander";       // ссылка «Написать мне»
// =======================
var DATA = {"work1": [{"t": "Тарифы и выезд", "items": [["Минимальный выезд мастера (до 1 часа работы)", "шт.", 1500], ["Дополнительный час работы мастера", "час", 1200], ["Мастер на полдня (до 4 часов)", "шт.", 4500], ["Мастер на день (до 8 часов)", "шт.", 8000], ["Осмотр и составление сметы", "шт.", 1000]]}, {"t": "Навеска и крепёж", "items": [["Навеска полки / картины / зеркала (стандарт)", "шт.", 800], ["Навеска большого или тяжёлого зеркала", "шт.", 1600], ["Навеска настенного шкафа", "шт.", 1500], ["Навеска телевизора на кронштейн", "шт.", 2000], ["Монтаж карниза", "шт.", 1200], ["Установка жалюзи / рулонных штор", "шт.", 800], ["Навеска аксессуаров в ванной (крючок, полотенцедержатель)", "шт.", 400], ["Навеска штор / тюли на карниз", "шт.", 500], ["Навеска часов / маркерной доски", "шт.", 450], ["Монтаж турника / спортивного оборудования", "шт.", 1200]]}, {"t": "Двери, замки, окна", "items": [["Врезка замка в дверь", "шт.", 1500], ["Замена личинки замка", "шт.", 800], ["Замена замка в металлической двери", "шт.", 1200], ["Установка дверной ручки", "шт.", 600], ["Установка дверного доводчика", "шт.", 1500], ["Замена / регулировка дверных петель", "шт.", 1000], ["Регулировка пластиковых окон и дверей", "шт.", 800], ["Установка москитной сетки", "шт.", 500], ["Установка межкомнатной двери (коробка, полотно, наличники)", "шт.", 7000]]}, {"t": "Прочий мелкий ремонт", "items": [["Сверление отверстия в бетоне / плитке", "шт.", 300], ["Установка наличников", "шт.", 800], ["Установка кухонного фартука", "шт.", 1000], ["Выпил отверстия в столешнице", "шт.", 1000], ["Замена уголка на столешнице", "шт.", 990], ["Перестановка / перенос мебели", "шт.", 500], ["Герметизация швов (ванная, кухня, силикон)", "пог.м", 300]]}], "work2": [{"t": "Сборка мебели", "items": [["Сборка шкафа (распашного)", "шт.", 2500], ["Сборка комода / тумбы / стеллажа", "шт.", 1500], ["Сборка кровати", "шт.", 1800], ["Сборка стола", "шт.", 1500], ["Сборка стула", "шт.", 600], ["Сборка и установка кухонных модулей", "пог.м", 2500], ["Разборка мебели", "шт.", 800]]}, {"t": "Кухня и бытовая техника", "items": [["Установка кухонной вытяжки (без воздуховода)", "шт.", 2500], ["Врезка варочной панели в столешницу", "шт.", 2500]]}, {"t": "Мелкая электрика", "items": [["Замена розетки / выключателя", "шт.", 500], ["Установка новой розетки / выключателя", "шт.", 700], ["Установка светильника / бра", "шт.", 800], ["Установка люстры", "шт.", 1800], ["Установка автомата / УЗО", "шт.", 800], ["Установка электрического полотенцесушителя (на готовую розетку)", "шт.", 1500], ["Установка дверного звонка", "шт.", 600]]}, {"t": "Мелкая сантехника", "items": [["Установка смесителя", "шт.", 1500], ["Замена сифона", "шт.", 800], ["Замена гибкой подводки", "шт.", 500], ["Установка раковины / мойки", "шт.", 1800], ["Установка унитаза", "шт.", 3000], ["Подключение стиральной / посудомоечной машины", "шт.", 1800], ["Устранение засора", "усл.", 1800], ["Установка душевой шторки / карниза в ванной", "шт.", 700]]}, {"t": "Полы и плинтус", "items": [["Укладка ламината / линолеума (небольшие площади)", "м²", 500], ["Монтаж напольного плинтуса", "пог.м", 250]]}], "mat": [{"t": "Дюбели и саморезы", "items": [["Дюбель-гвоздь 6×40 (уп. 100 шт.)", "уп.", 250], ["Дюбель распорный 8×40 (уп. 50 шт.)", "уп.", 180], ["Дюбель для гипсокартона «бабочка» (уп. 20 шт.)", "уп.", 220], ["Дюбель-молли для ГКЛ (уп. 10 шт.)", "уп.", 250], ["Саморезы универсальные 3,5×35 (уп. 100 шт.)", "уп.", 200], ["Саморезы по дереву 4×50 (уп. 100 шт.)", "уп.", 260], ["Шурупы с полукруглой головкой + шайбы (уп. 50 шт.)", "уп.", 240], ["Анкер-клин 10×100 (уп. 10 шт.)", "уп.", 350], ["Крюк / ввинчивающийся крючок (набор)", "уп.", 150]]}, {"t": "Монтажные уголки и пластины", "items": [["Уголок мебельный металлический 40×40", "шт.", 25], ["Пластина крепёжная 60×20", "шт.", 20], ["Кронштейн для полки (пара)", "пара", 280], ["Кронштейн для телевизора наклонно-поворотный", "шт.", 1800], ["Шина / планка для крепления картин и зеркал", "шт.", 200]]}, {"t": "Фурнитура мебельная", "items": [["Петля мебельная накладная с доводчиком", "шт.", 180], ["Петля мебельная накладная", "шт.", 70], ["Ручка-скоба мебельная 128 мм", "шт.", 150], ["Направляющие шариковые 450 мм (пара)", "пара", 520], ["Подъёмник для фасада (газлифт)", "шт.", 450], ["Механизм подъёма двери шкафа", "шт.", 600], ["Магнитный фиксатор дверной", "шт.", 90], ["Карниз потолочный 2-рядный 2 м", "шт.", 900], ["Карниз настенный 2 м", "шт.", 1200], ["Штанга для штор + кронштейны", "шт.", 1600]]}, {"t": "Дверная фурнитура", "items": [["Петля дверная универсальная 100 мм", "шт.", 150], ["Ручка дверная межкомнатная", "шт.", 900], ["Замок врезной межкомнатный", "шт.", 800], ["Цилиндр для замка 60 мм", "шт.", 900], ["Личинка замка входная 70 мм", "шт.", 1800], ["Ответная планка", "шт.", 120], ["Доводчик дверной", "шт.", 1800], ["Глазок дверной", "шт.", 400], ["Уплотнитель дверной самоклеящийся (рулон 6 м)", "шт.", 250]]}, {"t": "Электрика", "items": [["Розетка с заземлением (механизм) 16 А", "шт.", 250], ["Выключатель одноклавишный (механизм)", "шт.", 200], ["Рамка одинарная", "шт.", 70], ["Лампа светодиодная E27 10 Вт", "шт.", 140], ["Лампа светодиодная GU10 / GX53", "шт.", 220], ["Патрон с проводом E27", "шт.", 90], ["Удлинитель 4 розетки 3 м", "шт.", 600], ["Кабель ПВС 3×1,5", "пог.м", 70], ["Клемма WAGO 3 контакта", "шт.", 50], ["Изолента ПВХ", "шт.", 140]]}, {"t": "Сантехника", "items": [["Гибкая подводка для воды 50 см", "шт.", 130], ["Сифон для раковины", "шт.", 520], ["Смеситель для раковины (мелкий ремонт)", "шт.", 3200], ["Картридж для смесителя 35 мм", "шт.", 450], ["Прокладки и ремкомплект (набор)", "шт.", 200], ["Лента ФУМ", "шт.", 90], ["Бачок унитаза: арматура наливная + сливная", "шт.", 1300], ["Шланг душевой 1,5 м", "шт.", 450], ["Лейка душевая", "шт.", 600], ["Гофра / переходник для стиральной машины", "шт.", 350]]}, {"t": "Герметики, клеи, расходники", "items": [["Герметик силиконовый санитарный", "шт.", 420], ["Монтажная пена 750 мл", "шт.", 550], ["Жидкие гвозди 400 г", "шт.", 350], ["Клей универсальный", "шт.", 250], ["Двусторонний скотч монтажный", "шт.", 250], ["Малярный скотч 48 мм", "шт.", 150], ["Смазка WD-40 / силиконовая", "шт.", 450], ["Стяжки пластиковые (уп. 100 шт.)", "уп.", 150], ["Наждачная бумага (лист)", "шт.", 25], ["Мусорные мешки строительные (уп. 10 шт.)", "уп.", 200]]}]};
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
try{ if(tg){ tg.ready(); tg.expand(); } }catch(e){}
var S = {tab:'calc', mode:1, cat:'work1', q:'', q1:{}, q2:{}, sur:0, disc:0, markup:0};
var money = function(n){ return Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' ₽'; };
var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); };
function key(c,i,j){ return c+'|'+i+'|'+j; }
function qty(m,k){ return (m===1?S.q1:S.q2)[k]||0; }
function setQty(m,k,v){ v=Math.max(0,Math.min(999,Math.floor(v)||0)); var o=(m===1?S.q1:S.q2); if(v) o[k]=v; else delete o[k]; }
function price(c,it){ return c==='mat' ? Math.round(it[2]*(1+S.markup/100)) : it[2]; }
function haptic(){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); }catch(e){} }

function collect(mode){
  var works=[], mats=[];
  ['work1','work2'].forEach(function(c){ DATA[c].forEach(function(s,i){ s.items.forEach(function(it,j){ var q=qty(mode,key(c,i,j)); if(q) works.push({n:it[0],u:it[1],q:q,p:it[2]}); }); }); });
  DATA.mat.forEach(function(s,i){ s.items.forEach(function(it,j){ var q=qty(mode,key('mat',i,j)); if(q) mats.push({n:it[0],u:it[1],q:q,p:price('mat',it)}); }); });
  return {works:works,mats:mats};
}
function calc(mode){
  var d=collect(mode), w=0, m=0;
  d.works.forEach(function(x){ x.s=x.q*x.p; w+=x.s; });
  d.mats.forEach(function(x){ x.s=x.q*x.p; m+=x.s; });
  var sur=Math.round(w*S.sur/100), wsur=w+sur;
  var disc=Math.min(Math.round(wsur*S.disc/100), wsur);
  var total=wsur+m, final=total-disc;
  return {works:d.works,mats:d.mats,w:w,m:m,sur:sur,wsur:wsur,disc:disc,total:total,final:final,count:d.works.length+d.mats.length};
}
function renderList(){
  var c=S.cat, q=S.q.trim().toLowerCase(), html='', shown=0;
  document.getElementById('hint').innerHTML = c==='mat'
    ? 'Материалы считаются отдельным блоком. Для клиента цена = закупка + наценка. На материалы надбавка и скидка не действуют.'
    : 'Нажмите «+» у нужной работы. Цены из прайса, их можно менять в таблице под себя.';
  DATA[c].forEach(function(s,i){
    var rows='';
    s.items.forEach(function(it,j){
      if(q && it[0].toLowerCase().indexOf(q)<0) return;
      var k=key(c,i,j), v=qty(S.mode,k); shown++;
      rows+='<div class="item'+(v?' on':'')+'"><div class="nm">'+esc(it[0])+'<div class="pr">'+money(price(c,it))+' / '+esc(it[1])+(v?' · '+money(v*price(c,it)):'')+'</div></div>'
        +'<div class="step">'+(v?'<button class="m" data-a="-" data-k="'+k+'">−</button><input inputmode="numeric" data-k="'+k+'" value="'+v+'">':'')+'<button data-a="+" data-k="'+k+'">+</button></div></div>';
    });
    if(rows) html+='<div class="sec">'+esc(s.t)+'</div>'+rows;
  });
  if(c==='mat'){ html='<div class="ctl"><div class="lab">Наценка на материалы</div>'+[0,10,15,20].map(function(x){return '<button class="small'+(S.markup===x?' on':'')+'" data-mk="'+x+'">'+x+'%</button>';}).join('')+'</div>'+html; }
  if(!shown) html+='<div class="empty">Ничего не найдено</div>';
  document.getElementById('list').innerHTML=html;
}
function table(rows,startN){
  var h='<table><tr><th style="width:8%">№</th><th>Наименование</th><th style="width:9%">Ед.</th><th style="width:9%">Кол</th><th style="width:16%">Цена</th><th style="width:17%">Сумма</th></tr>';
  rows.forEach(function(x,i){ h+='<tr><td class="n">'+(startN+i)+'</td><td>'+esc(x.n)+'</td><td class="u">'+esc(x.u)+'</td><td class="q">'+x.q+'</td><td class="p">'+money(x.p)+'</td><td class="s">'+money(x.s)+'</td></tr>'; });
  return h;
}
function docHtml(kind){
  var r=calc(kind==='dop'?2:1);
  var title = kind==='smeta'?'СМЕТА':(kind==='dop'?'ДОПОЛНИТЕЛЬНОЕ СОГЛАШЕНИЕ':'АКТ ПРИЁМКИ-СДАЧИ РАБОТ');
  var note = kind==='smeta'?'Приложение №1 к договору':(kind==='dop'?'Дополнительные работы и материалы':'Подрядчик выполнил, а Заказчик принял следующие работы');
  var ctl='';
  if(kind!=='akt'){
    ctl='<div class="ctl"><div class="lab">Надбавка за сложность (только на работы)</div>'+[0,10,15,20].map(function(x){return '<button class="small'+(S.sur===x?' on':'')+'" data-sur="'+x+'">'+x+'%</button>';}).join('')
      +'<div class="lab">Скидка клиенту (только на работы)</div>'+[0,5,10].map(function(x){return '<button class="small'+(S.disc===x?' on':'')+'" data-disc="'+x+'">'+x+'%</button>';}).join('')+'</div>';
  } else {
    ctl='<div class="hint">В Акт попадают только выполненные работы: основные и дополнительные. Материалы в акт не входят.</div>';
  }
  if(kind==='akt'){
    var a=calc(1), b=calc(2);
    if(!a.works.length && !b.works.length) return ctl+'<div class="empty">Добавьте работы на вкладке «Позиции», и акт соберётся сам.</div>'+cta();
    var h='<div class="doc"><h2>'+title+'</h2><div class="sub">'+note+'</div>';
    var n=1;
    if(a.works.length){ h+=table(a.works,1)+'<tr class="tot"><td colspan="5">Итого по работам без надбавки</td><td class="s">'+money(a.w)+'</td></tr>';
      if(S.sur) h+='<tr class="line"><td colspan="5">Надбавка за сложность ('+S.sur+'%)</td><td class="s">'+money(a.sur)+'</td></tr><tr class="tot"><td colspan="5">Итого с надбавкой</td><td class="s">'+money(a.wsur)+'</td></tr>';
      if(S.disc) h+='<tr class="line"><td colspan="5">Скидка ('+S.disc+'%)</td><td class="s">−'+money(a.disc)+'</td></tr><tr class="tot"><td colspan="5">ИТОГО по основным работам</td><td class="s">'+money(a.wsur-a.disc)+'</td></tr>';
      h+='</table>'; n=a.works.length+1; }
    if(b.works.length){ h+='<div class="sub" style="margin-top:12px;font-weight:700;color:#1c222a">Дополнительные работы (допсоглашение)</div>'+table(b.works,1)+'<tr class="tot"><td colspan="5">Итого по дополнительным работам</td><td class="s">'+money(b.w)+'</td></tr></table>'; }
    h+='</div>';
    var tot=(a.works.length?a.wsur-a.disc:0)+(b.works.length?b.wsur-b.disc:0);
    h+='<div class="final"><div class="a">Итого по акту</div><div class="b">'+money(tot)+'</div></div>';
    return ctl+h+cta();
  }
  if(!r.count) return '<div class="empty">Добавьте позиции на вкладке «Позиции», и '+(kind==='smeta'?'смета':'допсоглашение')+' соберётся сама.</div>'+cta();
  var h='<div class="doc"><h2>'+title+'</h2><div class="sub">'+note+'</div>';
  var t='';
  if(r.works.length){ t+=table(r.works,1)+'<tr class="tot"><td colspan="5">Итого по работам без надбавки</td><td class="s">'+money(r.w)+'</td></tr>';
    if(S.sur) t+='<tr class="line"><td colspan="5">Надбавка за сложность ('+S.sur+'%)</td><td class="s">'+money(r.sur)+'</td></tr><tr class="tot"><td colspan="5">Итого по работам с надбавкой</td><td class="s">'+money(r.wsur)+'</td></tr>';
    t+='</table>'; }
  var n0=r.works.length;
  if(r.mats.length){ t+='<div class="sub" style="margin-top:12px;font-weight:700;color:#1c222a">Материалы</div>'+table(r.mats,n0+1)+'<tr class="tot"><td colspan="5">Итого по материалам</td><td class="s">'+money(r.m)+'</td></tr></table>'; }
  h+=t+'<table><tr class="tot"><td colspan="5">Итого по смете, без скидки</td><td class="s">'+money(r.total)+'</td></tr>';
  if(S.disc) h+='<tr class="line"><td colspan="5">Скидка ('+S.disc+'%)</td><td class="s">−'+money(r.disc)+'</td></tr>';
  h+='</table></div><div class="final"><div class="a">'+(S.disc?'ИТОГО со скидкой':'ИТОГО')+'</div><div class="b">'+money(r.final)+'</div></div>';
  return ctl+h+cta();
}
function cta(){
  return '<div class="cta"><h3>Такие документы — за пару минут</h3><p>В наборе 5 таблиц: электрика, сантехника, плитка, отделка и мастер на час. Плюс пустые шаблоны под свои услуги, договоры, расписки и акты.</p>'
   +'<button class="btn full" data-go="buy">Забрать таблицы</button><button class="btn ghost full" data-go="contact">Написать мне в Telegram</button></div>';
}
function openUrl(u){
  try{
    if(tg && /^https?:\/\/t\.me\//.test(u) && tg.openTelegramLink){ tg.openTelegramLink(u); return; }
    if(tg && tg.openLink){ tg.openLink(u); return; }
  }catch(e){}
  window.open(u,'_blank');
}
function refreshBar(){
  var r=calc(1), r2=calc(2);
  var cnt=r.count+r2.count, sum=r.final+r2.final;
  document.getElementById('bsum').textContent=money(sum);
  document.getElementById('bcnt').textContent='позиций: '+cnt;
  document.getElementById('bgo').textContent = S.tab==='calc' ? 'Смотреть смету' : 'К позициям';
}
function show(t){
  S.tab=t;
  ['calc','smeta','dop','akt'].forEach(function(x){ document.getElementById('v-'+x).classList.toggle('on',x===t); });
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){ b.classList.toggle('on',b.dataset.t===t); });
  if(t!=='calc') document.getElementById('v-'+t).innerHTML=docHtml(t);
  refreshBar(); window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.t){ show(b.dataset.t); return; }
  if(b.dataset.m){ S.mode=+b.dataset.m; [].forEach.call(document.querySelectorAll('[data-m]'),function(x){x.classList.toggle('on',x===b);}); renderList(); return; }
  if(b.dataset.c){ S.cat=b.dataset.c; [].forEach.call(document.querySelectorAll('[data-c]'),function(x){x.classList.toggle('on',x===b);}); renderList(); window.scrollTo(0,0); return; }
  if(b.dataset.k && b.dataset.a){ var k=b.dataset.k, v=qty(S.mode,k)+(b.dataset.a==='+'?1:-1); setQty(S.mode,k,v); haptic(); renderList(); refreshBar(); return; }
  if(b.dataset.mk){ S.markup=+b.dataset.mk; renderList(); refreshBar(); return; }
  if(b.dataset.sur!==undefined){ S.sur=+b.dataset.sur; show(S.tab); return; }
  if(b.dataset.disc!==undefined){ S.disc=+b.dataset.disc; show(S.tab); return; }
  if(b.dataset.go==='buy'){ openUrl(BUY_URL); return; }
  if(b.dataset.go==='contact'){ openUrl(CONTACT_URL); return; }
  if(b.id==='bgo'){ show(S.tab==='calc'?'smeta':'calc'); return; }
  if(b.id==='reset'){ S.q1={};S.q2={};S.sur=0;S.disc=0;renderList();refreshBar(); return; }
  if(b.id==='demo'){
    S.q1={}; S.q2={}; S.sur=15; S.disc=5;
    var d1={'work1|0|0':1,'work1|1|0':3,'work1|1|3':1,'work1|1|4':2,'work2|2|0':4,'work2|3|0':1,'work2|3|1':1};
    var d2={'work1|0|1':2,'work2|2|2':1}; var dm={'mat|0|0':1,'mat|0|1':1,'mat|4|0':4,'mat|5|1':1};
    for(var a in d1) S.q1[a]=d1[a]; for(var a2 in d2) S.q2[a2]=d2[a2]; for(var a3 in dm) S.q1[a3]=dm[a3];
    renderList(); refreshBar(); show('smeta'); return; }
});
document.addEventListener('change',function(e){ var i=e.target; if(i.tagName==='INPUT' && i.dataset.k){ setQty(S.mode,i.dataset.k,parseInt(i.value,10)); renderList(); refreshBar(); } });
document.getElementById('q').addEventListener('input',function(e){ S.q=e.target.value; renderList(); });
renderList(); refreshBar();
</script>
</body>
</html>
