<style>
:root{--cream:#F6F2E6;--paper:#FCFAF4;--sage:#E3EEE1;--sage2:#CFE3D3;--green:#12805D;--green-d:#0B5C43;--ink:#16241D;--muted:#55645B;--line:#D8D5C4;--sun:#E3A72F;--blue:#2F5597;
--fd:'Unbounded','Onest',system-ui,sans-serif;--fb:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;--fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5}
body{padding-top:var(--sat);padding-bottom:calc(72px + var(--sab))}
img{display:block;max-width:100%;height:auto}
h1,h2,h3{font-family:var(--fd);font-weight:600;line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:27px}h2{font-size:22px}h3{font-size:16px;line-height:1.25}
p{margin:0}button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green-d);font-weight:500}
.lead{color:var(--muted);font-size:16px}
/* top */
.top{position:sticky;top:var(--sat);z-index:20;background:var(--cream);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px}.brand img{height:36px;width:auto}
.brand b{display:block;line-height:1;font-weight:800;font-size:13px;letter-spacing:.02em}.brand b span{display:block;font-family:var(--fd);font-size:17px;color:var(--green-d);margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font-weight:700;font-size:16px;background:var(--green);color:#fff;cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.o{background:#fff;color:var(--green-d);border:1.5px solid var(--green)}
.btn.s{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.block{display:flex;width:100%}
.btn.sun{background:var(--sun);color:var(--ink)}
/* sections */
.view{display:none}.view.on{display:block}
.band{padding-block:28px}
.band.alt{background:var(--paper);border-block:1px solid var(--line)}
.band.sage{background:var(--sage)}
.head{display:grid;gap:8px;margin-bottom:18px}
/* hero */
.hero{background:var(--sage);background-image:linear-gradient(var(--sage2) 1px,transparent 1px),linear-gradient(90deg,var(--sage2) 1px,transparent 1px);background-size:36px 36px;border-bottom:1px solid var(--line);padding-block:26px 28px}
.hero .txt{display:grid;gap:16px}
.hero figure{margin:20px 0 0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--cream)}
.cta{display:grid;gap:10px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--fm);font-size:12.5px;color:var(--green-d);font-weight:500}
.facts span::before{content:"";display:inline-block;width:7px;height:7px;background:var(--green);margin-right:7px;transform:translateY(-1px)}
/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.steps{display:grid;gap:10px;counter-reset:s}
.step{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.step i{flex:none;width:34px;height:34px;border-radius:10px;background:var(--green);color:#fff;font-style:normal;font-family:var(--fm);font-weight:600;display:flex;align-items:center;justify-content:center}
.step b{display:block;font-size:16px}.step span{color:var(--muted);font-size:14.5px;line-height:1.4}
.tbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;font-size:15px}
.tbl th{background:var(--blue);color:#fff;text-align:left;padding:10px 14px;font-weight:600;font-size:13px}
.tbl td{padding:11px 14px;border-top:1px solid #ececec;vertical-align:top}.tbl tr:nth-child(even) td{background:#F7F9F6}
.tbl td.c,.tbl th.c{text-align:center;font-family:var(--fm);font-weight:600}
/* catalog */
.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:16px;outline:none}
.search:focus{border-color:var(--green)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.fchip[aria-pressed=true]{background:var(--green-d);border-color:var(--green-d);color:#fff}
.list{display:grid;gap:10px;margin-top:12px}
.row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-decoration:none;color:inherit;cursor:pointer}
.row:active{background:var(--sage)}
.row .ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--sage);display:flex;align-items:center;justify-content:center}.row .ic img{width:28px;height:28px}
.row b{display:block;font-size:16px;line-height:1.2}.row small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.row .ch{margin-left:auto;color:var(--green);font-size:22px;font-weight:700}
.gtitle{font-family:var(--fm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green-d);margin:18px 0 -2px}
.none{text-align:center;color:var(--muted);padding:24px 0}
/* table page */
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.num small{display:block;font-family:var(--fm);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num b{font-family:var(--fd);font-size:26px;color:var(--green-d)}.num span{font-size:14px;margin-left:5px}
.vtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}.vtabs::-webkit-scrollbar{display:none}
.vtab{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.vtab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.shot{border:1px solid #bdbdbd;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(22,36,29,.12)}
.shot .bar{background:#217346;color:#fff;height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px;font-weight:600}.shot .bar i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55)}
.vcap{color:var(--muted);font-size:14.5px;margin-top:10px}
.sec{display:flex;flex-wrap:wrap;gap:8px}.sec span{background:var(--sage);color:var(--green-d);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600}
/* price */
.price b{font-family:var(--fd);font-size:44px;color:var(--green-d);display:block;line-height:1}.price small{display:block;color:var(--muted);margin-top:6px}
.promo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:var(--yel,#FFF2CC);border:1.5px dashed var(--sun);border-radius:14px;padding:12px 14px;background:#FFF2CC}
.promo span{font-family:var(--fm);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
.promo b{font-family:var(--fm);font-size:20px;letter-spacing:.05em}
.promo em{font-style:normal;font-size:13px;color:var(--muted);display:block;margin-top:2px}
.ck{color:var(--green);font-weight:800}
/* faq */
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--green);font-size:20px;line-height:1}
details[open] summary::after{content:"−"}
details .a{padding:0 16px 14px;color:var(--muted);font-size:15px}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tb{border:0;background:transparent;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-current=true]{color:var(--green-d)}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(22,36,29,.45);display:none;align-items:flex-end}
.ov.on{display:flex}
.sheet{width:100%;max-width:560px;margin:0 auto;background:var(--cream);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + var(--sab));display:grid;gap:12px}
.sheet h3{font-size:18px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;padding:15px;font-weight:800;font-size:17px;color:#fff;border:0;text-decoration:none;cursor:pointer}
.wa{background:#1fa855}.tg{background:#229ED9}.mx{background:#6b3fd4}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;display:none}
.toast.on{display:block}
.foot{color:var(--muted);font-size:13px;text-align:center;padding:10px 16px 0}
</style></head><body>

function go(v,arg){stack.push([v,arg]);render(v,arg);}
